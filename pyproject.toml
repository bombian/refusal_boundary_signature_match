[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bombian-refusal_boundary_signature_match"
version = "0.1.0"
description = "通过字符级与结构级特征识别MoE 模型架构师·拒答边界与过度拒答的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bombian" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://bombian.github.io"
Repository = "https://github.com/bombian/refusal_boundary_signature_match"
Issues = "https://github.com/bombian/refusal_boundary_signature_match/issues"

[project.scripts]
refusal_boundary_signature_match = "refusal_boundary_signature_match:main"

[tool.setuptools]
py-modules = ["refusal_boundary_signature_match"]
